name: autofix.ci # needed to securely identify the workflow

on:
  pull_request:

permissions:
  contents: read

jobs:
  # format-text and format-shell in one job to ensure we don't require multiple fix commits and CI re-runs
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - uses: actions/setup-go@v6
        with:
          go-version: "oldstable"

      - name: Install shfmt
        run: go install mvdan.cc/sh/v3/cmd/shfmt@v3.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format text
        run: pnpm format-text

      - name: Format shell
        run: pnpm format-shell

      - name: Format codebase (.ts)
        run: pnpm format

      # See https://autofix.ci/
      - uses: autofix-ci/action@v1
